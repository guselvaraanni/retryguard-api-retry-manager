spring.application.name=retryguard
server.port=8082

# PostgreSQL is configured in Stage 2. Until then, skip DataSource/JPA auto-configuration
# so the application can start without a database.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
