spring.application.name=retryguard
server.port=8082

# Loads DB_URL, DB_USERNAME and DB_PASSWORD from a local .env file (git-ignored).
# Real environment variables with the same names take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update: Hibernate creates/alters tables to match entities. Fine for development;
# production systems use versioned migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
